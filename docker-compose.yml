services:
  app:
    depends_on:
      init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    container_name: percursos-app
    restart: unless-stopped
    ports:
      - "5010:8000"
    volumes:
      - percursos-data:/data
      - percursos-uploads:/app/uploads
      - percursos-tiles:/app/tile-cache
      - percursos-backups:/backups
    environment:
      - PERCURSOS_DATA_DIR=/data
      - PERCURSOS_UPLOADS_DIR=/app/uploads
      - PERCURSOS_TILE_CACHE_DIR=/app/tile-cache
      - PERCURSOS_BACKUPS_DIR=/backups
      - PERCURSOS_BACKUP_RETENTION_DAYS=${PERCURSOS_BACKUP_RETENTION_DAYS:-30}
      - PERCURSOS_SECRET_KEY=${PERCURSOS_SECRET_KEY:-change-me-in-production}
      - PERCURSOS_ENV=${PERCURSOS_ENV:-production}
      - PERCURSOS_SESSION_COOKIE_SECURE=${PERCURSOS_SESSION_COOKIE_SECURE:-false}
      - PERCURSOS_DEFAULT_ADMIN_USERNAME=${PERCURSOS_DEFAULT_ADMIN_USERNAME:-admin}
      - PERCURSOS_DEFAULT_ADMIN_PASSWORD=${PERCURSOS_DEFAULT_ADMIN_PASSWORD:-pass}
      - PERCURSOS_VAPID_PRIVATE_KEY=${PERCURSOS_VAPID_PRIVATE_KEY:-}
      - PERCURSOS_VAPID_PUBLIC_KEY=${PERCURSOS_VAPID_PUBLIC_KEY:-}
      - PERCURSOS_VAPID_SUBJECT=${PERCURSOS_VAPID_SUBJECT:-}
      - PERCURSOS_CARTO_TILES_KEY=${PERCURSOS_CARTO_TILES_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: percursos-init
    restart: "no"
    command: ["python", "/app/init_prepare.py"]
    volumes:
      - percursos-data:/data
      - percursos-uploads:/app/uploads
      - percursos-tiles:/app/tile-cache
      - percursos-backups:/backups
    environment:
      - PERCURSOS_DATA_DIR=/data
      - PERCURSOS_UPLOADS_DIR=/app/uploads
      - PERCURSOS_TILE_CACHE_DIR=/app/tile-cache
      - PERCURSOS_BACKUPS_DIR=/backups
      - PERCURSOS_SECRET_KEY=${PERCURSOS_SECRET_KEY:-change-me-in-production}
      - PERCURSOS_ENV=${PERCURSOS_ENV:-production}
      - PERCURSOS_DEFAULT_ADMIN_USERNAME=${PERCURSOS_DEFAULT_ADMIN_USERNAME:-admin}
      - PERCURSOS_DEFAULT_ADMIN_PASSWORD=${PERCURSOS_DEFAULT_ADMIN_PASSWORD:-pass}

volumes:
  percursos-data:
  percursos-uploads:
  percursos-tiles:
  percursos-backups:
