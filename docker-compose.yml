services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: percursos-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - percursos-data:/data
      - percursos-uploads:/app/uploads
      - percursos-tiles:/app/tile-cache
    environment:
      - PERCURSOS_DATA_DIR=/data
      - PERCURSOS_UPLOADS_DIR=/app/uploads
      - PERCURSOS_TILE_CACHE_DIR=/app/tile-cache
      - PERCURSOS_SECRET_KEY=${PERCURSOS_SECRET_KEY:-change-me-in-production}
      - PERCURSOS_ENV=${PERCURSOS_ENV:-production}
      - PERCURSOS_DEFAULT_ADMIN_USERNAME=${PERCURSOS_DEFAULT_ADMIN_USERNAME:-admin}
      - PERCURSOS_DEFAULT_ADMIN_PASSWORD=${PERCURSOS_DEFAULT_ADMIN_PASSWORD:-pass}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: percursos-backup
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printenv | grep PERCURSOS_ >> /etc/environment
        echo "0 3 * * 0 cd /app && PYTHONPATH=/app /usr/local/bin/python -m app.backup >> /var/log/percursos-backup.log 2>&1" | crontab -
        cron -f
    volumes:
      - percursos-data:/data
      - percursos-uploads:/app/uploads:ro
      - percursos-backups:/backups
    environment:
      - PERCURSOS_DATA_DIR=/data
      - PERCURSOS_UPLOADS_DIR=/app/uploads
      - PERCURSOS_BACKUPS_DIR=/backups
      - PERCURSOS_BACKUP_RETENTION_DAYS=${PERCURSOS_BACKUP_RETENTION_DAYS:-30}

volumes:
  percursos-data:
  percursos-uploads:
  percursos-tiles:
  percursos-backups:
